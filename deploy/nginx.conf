server {
    listen 80;
    server_name 10.42.0.1 localhost;

    # Serve offline map tiles from persistent storage (survives frontend rebuilds)
    location /maps/ {
        alias /opt/mesh_pi5_server/maps/;
        add_header Access-Control-Allow-Origin *;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Serve font glyphs for offline map labels (street names, place names)
    location /fonts/ {
        alias /opt/mesh_pi5_server/fonts/;
        add_header Access-Control-Allow-Origin *;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Serve React Frontend
    location / {
        root /opt/mesh_pi5_server/frontend/dist;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy REST API to FastAPI
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy WebSockets to FastAPI
    location /ws {
        proxy_pass http://127.0.0.1:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400; # Keep WS alive
    }

    # Optional: Gzip compression for frontend assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
