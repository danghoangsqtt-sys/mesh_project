# Alert Configuration for Soldier Tracking System
# 
# This file defines alert thresholds for health monitoring
# Edit these values to customize when alerts are triggered

[health_alerts]
# Heart Rate (BPM)
heart_rate_min = 40
heart_rate_max = 100
heart_rate_critical_min = 30
heart_rate_critical_max = 100

# SpO2 (%)
spo2_min = 90
spo2_critical_min = 80

# Body Temperature (°C)
temperature_min = 35.0
temperature_max = 38.5
temperature_critical_min = 34.0
temperature_critical_max = 40.0

# Humidity (%)
humidity_max = 80.0
humidity_critical_max = 90.0
humidity_min = 15.0
humidity_critical_min = 10.0

# Barometric Pressure (hPa)
pressure_min = 980.0
pressure_critical_min = 960.0
pressure_max = 1050.0
pressure_critical_max = 1065.0

# Battery Voltage (V)
battery_low = 3.5
battery_critical = 3.3

[system_alerts]
# Man Down Detection
# Acceleration threshold in m/s² for man down
man_down_threshold = 20.0

# Communication timeout (seconds)
# How long before soldier is marked as offline
comm_timeout = 30

# GPS validity
# Alert if GPS is invalid for this many seconds
gps_timeout = 60

[alert_levels]
# Alert level priorities
# 0 = OK (green)
# 1 = Warning (orange/yellow)
# 2 = Critical (red)
# 3 = Emergency (flashing red)

# Heat stress level mapping
heat_stress_warning = 1
heat_stress_critical = 2

# Man down always critical
man_down_level = 3

# Battery alerts
battery_low_level = 1
battery_critical_level = 2

# Offline status
offline_level = 2